<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Executive Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css?v=13">
  <link rel="stylesheet" href="assets/css/login.css?v=13">
</head>
<body>
  <div class="login-page">
    <!-- Left panel: Branding -->
    <div class="login-brand">
      <div class="login-brand-inner">
        <img src="assets/img/logo-kp.svg" alt="Kelas Pintar" class="login-seal">
        <h1 class="login-brand-title">Executive Dashboard</h1>
        <p class="login-brand-desc">
          Sistem monitoring dan evaluasi kinerja sekolah —
          indeks pendidikan lintas kabupaten/kota secara real-time.
        </p>
        <div class="login-brand-footer">
          <span>© 2026 Kelas Pintar</span>
        </div>
      </div>
    </div>

    <!-- Right panel: Login form -->
    <div class="login-form-panel">
      <div class="login-form-container">
        <div class="login-form-header">
          <h2>Selamat Datang</h2>
          <p>Masuk untuk mengakses Executive Dashboard</p>
        </div>

        <form id="login-form" class="login-form" onsubmit="return handleLogin(event)">
          <div class="form-group">
            <label for="username">Nama Pengguna</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="username" name="username" placeholder="Masukkan nama pengguna" autocomplete="username" required>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Kata Sandi</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
            </div>
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember" name="remember">
              <span>Ingat saya</span>
            </label>
            <a href="#" class="forgot-link">Lupa kata sandi?</a>
          </div>

          <div id="login-error" class="login-error" style="display:none;"></div>

          <button type="submit" class="btn-login" id="btn-login">
            <span class="btn-text">Masuk</span>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
            </svg>
          </button>

          <div class="demo-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4"/><path d="M12 8h.01"/>
            </svg>
            <span>User: <strong>admin</strong> / <strong>bali2026</strong> · Admin import: <strong>duan1816</strong> / <strong>duan1816</strong></span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="lib/auth.js?v=11"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isAuthenticated()) {
      window.location.href = 'index.html';
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.querySelector('.btn-text').textContent = 'Memuat...';

      // Simulate auth delay
      setTimeout(() => {
        const result = Auth.login(username, password);
        if (result.success) {
          window.location.href = 'index.html';
        } else {
          errorEl.textContent = result.message;
          errorEl.style.display = 'flex';
          btn.disabled = false;
          btn.querySelector('.btn-text').textContent = 'Masuk';
          // Shake animation
          document.querySelector('.login-form').classList.add('shake');
          setTimeout(() => document.querySelector('.login-form').classList.remove('shake'), 500);
        }
      }, 600);

      return false;
    }
  </script>
</body>
</html>
